name: core_architecture
description: Reusable core architecture for Flutter projects
version: 1.3.1
publish_to: 'none'

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter

  # Json
  json_annotation: ^4.9.0

  # State Management
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^3.0.3

  # UI
  flutter_spinkit: ^5.2.2

  # Storage
  flutter_secure_storage: ^9.2.4

  # Logging
  logger: ^2.6.2

  # Utilities
  intl: ^0.20.2

  # Network
  dio: ^5.4.1

  # Environment
  flutter_dotenv: ^6.0.0

  # Routing
  go_router: ^16.3.0

  # URL Launcher
  url_launcher: ^6.3.2

  # Backend — Remove if not used (see README § Backend Selection)
  supabase_flutter: ^2.10.3

  # In-App Purchases — Remove if not used (also delete purchase_failure.dart)
  purchases_flutter: ^9.10.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  riverpod_generator: ^3.0.3
  build_runner: ^2.4.13
  flutter_lints: ^6.0.0
  json_serializable: ^6.11.1

flutter:
  uses-material-design: true

