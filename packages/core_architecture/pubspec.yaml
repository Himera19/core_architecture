name: core_architecture
description: Backend-agnostic core architecture for Flutter projects — design system, theming, responsive layer, storage, logging and shared providers.
version: 5.1.0
publish_to: 'none'
resolution: workspace

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter

  # Json
  json_annotation: ^4.9.0

  # State Management
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^3.0.3

  # Storage
  flutter_secure_storage: ^9.2.4

  # Logging
  logger: ^2.6.2

  # Utilities
  intl: ^0.20.2

  # Environment
  flutter_dotenv: ^6.0.0

  # URL Launcher
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  riverpod_generator: ^3.0.3
  build_runner: ^2.4.13
  flutter_lints: ^6.0.0
  json_serializable: ^6.11.1

flutter:
  uses-material-design: true
